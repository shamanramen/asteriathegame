name: Deploy game to GitHub Pages

on:
  push:
    branches: ["claude/stoic-archimedes-rrex1g"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on this repo if it isn't already
          enablement: true
      - name: Upload game/ as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
